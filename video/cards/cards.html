<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixwright video cards</title>
<style>
  /* Every visual is a pure function of the video time passed to __cards.at(t): no CSS animations, no timers. */
  @font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('../fonts/AtkinsonHyperlegibleNext-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('../fonts/AtkinsonHyperlegibleNext-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('../fonts/AtkinsonHyperlegibleNext-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Atkinson Hyperlegible Mono'; src: url('../fonts/AtkinsonHyperlegibleMono-Regular.ttf'); font-weight: 400; }
  :root {
    --wall-day: #CBD5D3;
    --wall-night: #1B2433;
    --lamplight: #FFB547;
    --ink: #1C2228;
    --paper: #EEF2F1;
    --fault: #C8463D;
    --sound: #3F8C6E;
    --rule: rgba(28, 34, 40, 0.16);
    --ink-2: rgba(28, 34, 40, 0.72);
    --sans: 'Atkinson Hyperlegible Next', sans-serif;
    --mono: 'Atkinson Hyperlegible Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--wall-day); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #card { position: absolute; inset: 0; }
  /* The bottom 190 px stay clear for the burned in narrator captions. */
  .card { position: absolute; inset: 0; padding: 0 200px 190px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .reveal { opacity: 0; }
  .night { background: var(--wall-night); color: var(--paper); }
  .day { background: var(--wall-day); }
  .paper { background: var(--paper); }

  /* One room of the house plan, as the host draws it: an outlined room, its name, one dot per device. */
  .room { display: inline-flex; flex-direction: column; gap: 22px; padding: 22px 30px 26px; border: 2px solid currentColor; border-radius: 12px; min-width: 300px; }
  .room-name { font-size: 25px; font-weight: 500; opacity: 0.8; }
  .room-dots { display: flex; gap: 22px; align-items: center; }
  .pdot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid currentColor; opacity: 0.55; }
  .pdot.lamp { opacity: 1; border-color: transparent; }

  .open h1 { margin-top: 56px; font-size: 76px; line-height: 1.15; font-weight: 500; max-width: 1300px; }

  .title .room { color: var(--ink); }
  .wordmark { margin-top: 48px; font-size: 149px; line-height: 1; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin-top: 28px; font-size: 61px; line-height: 1.2; font-weight: 500; }
  .line { margin-top: 30px; font-size: 31px; line-height: 1.4; color: var(--ink-2); max-width: 1300px; }

  .bench h2 { font-size: 61px; line-height: 1.1; font-weight: 700; }
  .bench .lede { margin-top: 18px; font-size: 31px; line-height: 1.4; color: var(--ink-2); max-width: 1450px; }
  .legend { margin-top: 34px; display: flex; gap: 40px; font-size: 25px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 12px; }
  .rows { margin-top: 18px; width: 1520px; border-top: 2px solid var(--rule); }
  .brow { display: grid; grid-template-columns: 420px 747px 1fr; align-items: center; min-height: 104px; border-bottom: 2px solid var(--rule); column-gap: 36px; }
  .bname { font-size: 31px; line-height: 1.25; font-weight: 500; }
  .brow.lead .bname { font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(50, 12px); grid-auto-rows: 12px; gap: 3px; }
  .u { width: 12px; height: 12px; border-radius: 50%; }
  .legend .u { width: 14px; height: 14px; }
  .u.right { background: var(--sound); }
  .u.cant { border: 2px solid var(--ink); }
  .u.wrong { background: var(--fault); border-radius: 2px; }
  .u.hidden { visibility: hidden; }
  .bnum { text-align: right; font-variant-numeric: tabular-nums; }
  .bnum b { display: block; font-size: 39px; line-height: 1.1; font-weight: 700; white-space: nowrap; }
  .bnum small { display: block; margin-top: 4px; font-size: 22px; line-height: 1.3; color: var(--ink-2); }
  .pending { font-size: 25px; color: var(--ink-2); }
  .bench .foot { margin-top: 26px; font-size: 22px; line-height: 1.45; color: var(--ink-2); max-width: 1520px; }

  .term-card { align-items: center; padding-bottom: 170px; }
  .term { width: 1580px; height: 740px; border-radius: 12px; background: var(--ink); color: var(--paper); overflow: hidden; display: flex; flex-direction: column; }
  .term-bar { height: 52px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid rgba(238, 242, 241, 0.14); font: 22px var(--sans); color: rgba(238, 242, 241, 0.6); }
  .term-body { flex: 1; overflow: hidden; padding: 26px 34px; font: 25px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .term-body .cmd { font-weight: 400; }
  .term-body .req { color: var(--paper); }
  .term-body .res { color: rgba(238, 242, 241, 0.82); }
  .term-body .note { color: rgba(238, 242, 241, 0.55); }
  .cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.18em; background: var(--paper); }

  .slate h2 { font-size: 61px; line-height: 1.1; font-weight: 700; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; margin-top: 40px; width: 1520px; }
  .col h3 { font-size: 31px; font-weight: 700; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
  .col ul { list-style: none; }
  .col li { font-size: 29px; line-height: 1.3; padding: 13px 0; border-bottom: 2px solid var(--rule); }
  .slate .foot { margin-top: 28px; font-size: 29px; color: var(--ink-2); }
  .close { margin-top: 44px; display: flex; align-items: center; gap: 30px; font-size: 76px; line-height: 1.1; font-weight: 700; }
  .close .pdot { width: 38px; height: 38px; flex: none; }
</style>
</head>
<body>
<div id="card"></div>
<script>
(() => {
  const card = document.getElementById('card');
  let scene = null;
  let reveals = [];
  let lamps = [];
  let units = [];
  let term = null;
  let closeAt = NaN;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const reveal = (node, at) => {
    node.classList.add('reveal');
    reveals.push({ node, at });
    return node;
  };
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (p) => 1 - (1 - p) ** 3;
  const items = (kind) => scene.items.filter((r) => r.item.kind === kind);
  const mix = (a, b, p) => {
    const ca = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const cb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    return `rgb(${ca.map((v, i) => Math.round(v + (cb[i] - v) * p)).join(',')})`;
  };

  /** The hallway room with its lamp. `from` and `to` are dot colours; the change plays at `at`. */
  function hallway(from, to, at) {
    const room = el('div', 'room');
    room.append(el('span', 'room-name', 'Hallway'));
    const dots = el('span', 'room-dots');
    const lamp = el('i', 'pdot lamp');
    lamp.style.background = from;
    dots.append(lamp, el('i', 'pdot'));
    room.append(dots);
    lamps.push({ node: lamp, from, to, at });
    return room;
  }

  function buildOpen() {
    const root = el('div', 'card open night');
    root.append(reveal(hallway('#C8463D', '#C8463D', Infinity), scene.start));
    const t = items('title')[0];
    if (t) root.append(reveal(el('h1', '', t.item.text), t.at));
    return root;
  }

  function buildTitle() {
    const root = el('div', 'card title day');
    const t = items('title')[0];
    const at = t ? t.at : scene.start;
    root.append(hallway('#C8463D', '#FFB547', at + 0.5));
    root.append(reveal(el('h1', 'wordmark', t ? t.item.text : 'Fixwright'), at));
    const sub = items('sub')[0];
    if (sub) root.append(reveal(el('p', 'sub', sub.item.text), sub.at));
    const line = items('line')[0];
    if (line) root.append(reveal(el('p', 'line', line.item.text), line.at));
    return root;
  }

  function buildBench() {
    const root = el('div', 'card bench paper');
    const t = items('title')[0];
    if (t) root.append(reveal(el('h2', '', t.item.text), t.at));
    const sub = items('sub')[0];
    if (sub) root.append(reveal(el('p', 'lede', sub.item.text), sub.at));
    const head = items('head')[0];
    const names = head ? head.item.cells : ['Right', "Said it can't tell", 'Wrong', 'Right when it answered'];
    const legend = el('div', 'legend');
    [['right', names[0]], ['cant', names[1]], ['wrong', names[2]]].forEach(([k, label]) => {
      const s = el('span');
      s.append(el('i', `u ${k}`), document.createTextNode(label));
      legend.append(s);
    });
    root.append(reveal(legend, head ? head.at : scene.start));
    const rows = el('div', 'rows');
    const all = items('row');
    all.forEach((r, i) => {
      const [name, right, cant, wrong, when] = r.item.cells;
      const counts = [right, cant, wrong].map(Number);
      const row = el('div', `brow${i === all.length - 1 ? ' lead' : ''}`);
      row.append(el('div', 'bname', name));
      const grid = el('div', 'grid');
      const at = r.at + 0.25;
      if (counts.every(Number.isInteger)) {
        let n = 0;
        [['right', counts[0]], ['cant', counts[1]], ['wrong', counts[2]]].forEach(([k, c]) => {
          for (let j = 0; j < c; j++) {
            const u = el('i', `u ${k} hidden`);
            units.push({ node: u, at: at + (n++ / 100) * 0.9 });
            grid.append(u);
          }
        });
        row.append(grid);
        const num = el('div', 'bnum');
        num.append(el('b', '', `${counts[0]} right`), el('small', '', `${when} ${names[3].toLowerCase()}`));
        row.append(num);
      } else {
        row.append(el('div', 'pending', 'benchmark running'), el('div'));
      }
      rows.append(reveal(row, r.at));
    });
    root.append(rows);
    const foot = items('foot')[0];
    if (foot) root.append(reveal(el('p', 'foot', foot.item.text), foot.at));
    return root;
  }

  function buildTerminal(extras) {
    const root = el('div', 'card term-card day');
    const box = el('div', 'term');
    const bar = el('div', 'term-bar', 'A bare terminal client, no SDK');
    const body = el('div', 'term-body');
    box.append(bar, body);
    root.append(box);
    const r = items('terminal')[0];
    const lines = (extras && extras.terminal && extras.terminal.lines) || [{ kind: 'note', text: 'waiting for the plain client run' }];
    // The command types at 40 characters a second; each output line lands 0.35 s after the one before.
    let at = r ? r.at : scene.start;
    const times = lines.map((l) => {
      const start = at;
      at += l.kind === 'cmd' ? l.text.length / 40 + 0.3 : 0.35;
      return start;
    });
    term = { body, lines, times };
    return root;
  }

  function buildSlate() {
    const root = el('div', 'card slate day');
    const t = items('title')[0];
    if (t) root.append(reveal(el('h2', '', t.item.text), t.at));
    const cols = el('div', 'cols');
    const groups = [];
    for (const r of items('item')) {
      let g = groups.find((x) => x.name === r.item.group);
      if (!g) {
        g = { name: r.item.group, rows: [] };
        groups.push(g);
      }
      g.rows.push(r);
    }
    groups.forEach((g, gi) => {
      const col = el('div', 'col');
      const ul = el('ul');
      g.rows.forEach((r, i) => ul.append(reveal(el('li', '', r.item.text), r.at + gi * 0.5 + i * 0.12)));
      col.append(reveal(el('h3', '', g.name), g.rows[0].at + gi * 0.5), ul);
      cols.append(col);
    });
    root.append(cols);
    const foot = items('foot')[0];
    if (foot) root.append(reveal(el('p', 'foot', foot.item.text), foot.at + 1.2));
    const close = items('close')[0];
    if (close) {
      const c = el('p', 'close');
      const lamp = el('i', 'pdot lamp');
      lamp.style.background = '#FFB547';
      c.append(lamp, document.createTextNode(close.item.text));
      root.append(reveal(c, close.at));
      closeAt = close.at;
    }
    return root;
  }

  function renderTerminal(t) {
    if (!term) return;
    const frag = document.createDocumentFragment();
    let last = null;
    term.lines.forEach((l, i) => {
      const start = term.times[i];
      if (t < start) return;
      const line = el('div', l.kind);
      if (l.kind === 'cmd') {
        const shown = l.text.slice(0, Math.floor((t - start) * 40));
        line.append(document.createTextNode(`$ ${shown}`));
      } else {
        line.textContent = l.text;
      }
      frag.append(line);
      last = line;
    });
    if (last && Math.floor(t * 2) % 2 === 0) last.append(el('span', 'cursor'));
    term.body.replaceChildren(frag);
    term.body.scrollTop = term.body.scrollHeight;
  }

  window.__cards = {
    load(s, extras) {
      scene = s;
      reveals = [];
      lamps = [];
      units = [];
      term = null;
      closeAt = NaN;
      const kind = s.scene.card;
      const build = { open: buildOpen, title: buildTitle, bench: buildBench, terminal: buildTerminal, slate: buildSlate }[kind];
      if (!build) throw new Error(`unknown card ${kind}`);
      card.replaceChildren(build(extras));
      return document.fonts.ready.then(() => true);
    },
    at(t) {
      if (!scene) return;
      for (const r of reveals) {
        let o = easeOut(clamp((t - r.at) / 0.4));
        if (Number.isFinite(closeAt) && !r.node.classList.contains('close')) o *= 1 - 0.62 * clamp((t - closeAt) / 0.5);
        r.node.style.opacity = String(o);
      }
      for (const l of lamps) l.node.style.background = mix(l.from, l.to, Number.isFinite(l.at) ? easeOut(clamp((t - l.at) / 0.5)) : 0);
      for (const u of units) u.node.classList.toggle('hidden', t < u.at);
      renderTerminal(t);
    },
  };
  window.__cardsReady = true;
})();
</script>
</body>
</html>
