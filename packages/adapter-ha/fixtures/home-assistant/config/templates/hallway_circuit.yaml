        {{ device_on('input_text.landing_light_command', 'input_select.landing_light_power_on_behavior_store', this.state) }}
      attributes:
        linkquality: "{{ 132 }}"
      turn_on:
        - action: input_text.set_value
          target: { entity_id: input_text.landing_light_command }
          data: { value: "on {{ now().timestamp() }}" }
      turn_off:
        - action: input_text.set_value
          target: { entity_id: input_text.landing_light_command }
          data: { value: "off {{ now().timestamp() }}" }
    - name: Stair Light
      unique_id: fixwright_stair_light
      default_entity_id: light.stair_light
      availability: "{{ not is_state('binary_sensor.hallway_mains_power', 'off') }}"
      state: >-
        {% from 'bulb_firmware.jinja' import device_on %}
        {{ device_on('input_text.stair_light_command', 'input_select.stair_light_power_on_behavior_store', this.state) }}
      attributes:
        linkquality: "{{ 117 }}"
      turn_on:
        - action: input_text.set_value
          target: { entity_id: input_text.stair_light_command }
          data: { value: "on {{ now().timestamp() }}" }
      turn_off:
