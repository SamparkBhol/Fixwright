- switch:
    - name: Hallway Smart Plug
      unique_id: fixwright_hallway_smart_plug
      default_entity_id: switch.hallway_smart_plug
      availability: "{{ not is_state('binary_sensor.hallway_mains_power', 'off') }}"
      state: >-
        {% from 'bulb_firmware.jinja' import device_on %}
        {{ device_on('input_text.hallway_smart_plug_command', 'input_select.hallway_smart_plug_power_on_behavior_store', this.state) }}
      attributes:
        rssi: "{{ -61 }}"
      turn_on:
        - action: input_text.set_value
          target: { entity_id: input_text.hallway_smart_plug_command }
          data: { value: "on {{ now().timestamp() }}" }
      turn_off:
        - action: input_text.set_value
          target: { entity_id: input_text.hallway_smart_plug_command }
          data: { value: "off {{ now().timestamp() }}" }

- sensor:
    - name: Hallway Plug Power
      unique_id: fixwright_hallway_plug_power
      default_entity_id: sensor.hallway_plug_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: "{{ 7.5 if is_state('switch.hallway_smart_plug', 'on') else 0.4 }}"
      availability: "{{ not is_state('binary_sensor.hallway_mains_power', 'off') }}"

# Power on behavior selects, shaped like Zigbee2MQTT's select.<device>_power_on_behavior.
# They read and write the device memory above, so a change is a real select_option with a read-back.
- select:
    - name: Hallway Lamp Power On Behavior
      unique_id: fixwright_hallway_lamp_power_on_behavior
      default_entity_id: select.hallway_lamp_power_on_behavior
      options: "{{ state_attr('input_select.hallway_lamp_power_on_behavior_store', 'options') }}"
      state: "{{ states('input_select.hallway_lamp_power_on_behavior_store') }}"
      select_option:
        - action: input_select.select_option
          target: { entity_id: input_select.hallway_lamp_power_on_behavior_store }
          data: { option: "{{ option }}" }
    - name: Porch Light Power On Behavior
      unique_id: fixwright_porch_light_power_on_behavior
