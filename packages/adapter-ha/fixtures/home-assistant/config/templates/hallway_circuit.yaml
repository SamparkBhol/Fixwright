# The simulated hallway circuit: six devices on one breaker, each with a power on behavior select.
# Availability follows binary_sensor.hallway_mains_power, so a power cut makes Home Assistant itself
# compute "unavailable" (the same code path as a device dropping off the network), not a forced state.
# Device state comes from the simulated firmware in custom_templates/bulb_firmware.jinja.
# Signal attributes mirror what Zigbee2MQTT (linkquality) and Wi-Fi plugs (rssi) report.
- light:
    - name: Hallway Lamp
      unique_id: fixwright_hallway_lamp
      default_entity_id: light.hallway_lamp
      availability: "{{ not is_state('binary_sensor.hallway_mains_power', 'off') }}"
      state: >-
        {% from 'bulb_firmware.jinja' import device_on %}
        {{ device_on('input_text.hallway_lamp_command', 'input_select.hallway_lamp_power_on_behavior_store', this.state) }}
      attributes:
        linkquality: "{{ 148 }}"
      turn_on:
        - action: input_text.set_value
          target: { entity_id: input_text.hallway_lamp_command }
          data: { value: "on {{ now().timestamp() }}" }
      turn_off:
        - action: input_text.set_value
          target: { entity_id: input_text.hallway_lamp_command }
          data: { value: "off {{ now().timestamp() }}" }
    - name: Porch Light
      unique_id: fixwright_porch_light
      default_entity_id: light.porch_light
      # Also needs its radio link: input_boolean.porch_light_link off means the bulb left the mesh.
      availability: "{{ not is_state('binary_sensor.hallway_mains_power', 'off') and is_state('input_boolean.porch_light_link', 'on') }}"
      state: >-
        {% from 'bulb_firmware.jinja' import device_on %}
        {{ device_on('input_text.porch_light_command', 'input_select.porch_light_power_on_behavior_store', this.state) }}
      attributes:
        linkquality: "{{ 38 }}"
      turn_on:
        - action: input_text.set_value
          target: { entity_id: input_text.porch_light_command }
          data: { value: "on {{ now().timestamp() }}" }
      turn_off:
        - action: input_text.set_value
          target: { entity_id: input_text.porch_light_command }
          data: { value: "off {{ now().timestamp() }}" }
    - name: Landing Light
      unique_id: fixwright_landing_light
      default_entity_id: light.landing_light
