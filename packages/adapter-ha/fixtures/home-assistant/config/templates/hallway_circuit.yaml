        {% from 'bulb_firmware.jinja' import device_on %}
        {{ device_on('input_text.entry_light_command', 'input_select.entry_light_power_on_behavior_store', this.state) }}
      attributes:
        linkquality: "{{ 140 }}"
      turn_on:
        - action: input_text.set_value
          target: { entity_id: input_text.entry_light_command }
          data: { value: "on {{ now().timestamp() }}" }
      turn_off:
